name: Verify pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run all three stages, including real Docker deployment
        run: python scripts/run_pipeline.py --once
      - run: python -m pytest -q
      - name: Upload metrics and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: |
            reports/
            logs/
      - name: Stop CI containers
        if: always()
        run: docker compose -f code/deployment/docker-compose.yml down
